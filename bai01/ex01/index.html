<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Bai1 </title>
   <style>
    :root{
      --nen-khung: #FFFDE7;
      --vien-xam: #9E9E9E;
      --do-dam: #D40000;
      --hong-phan: #FFD9E6;
      --xanh-duong: #0033CC;
    }
 
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px
      background-color: #F5F5F5;
      font-family: "",serif;
    }
 
    .khung-tho {
        margin: 0px ;
      padding: 24px;
      box-sizing: border-box;
      background-color: var(--nen-khung);
      border: 1px solid var(--vien-xam);
    }
 
    .khung-tho h1 {
      margin: 0 0 20px;
      padding: 6px 0;
      background-color: var(--hong-phan);
      color: var(--do-dam);
      text-align: center;
      font-weight: bold;
      text-transform: uppercase;
      line-height: 1.35;
    }
    .kho {
      margin: 16px 0 0;
      font-style: italic;
      text-align: center;
      line-height: 1.47;
    }
 
    .kho.xanh {
      color: var(--xanh-duong);
    }
 
    .kho.do {
      color: var(--do-dam);
    }
 
    hr {
      width: 55%;
      margin: 16px auto;
      border: 0;
      border-top: 1px solid var(--xanh-duong);
    }
  </style>
</head>
<body>
  <article class="khung-tho">
    <h1>BỐN MÙA</h1>
 
    <p class="kho xanh">
      Xuân về hoa nở khắp trời<br>
      Hạ sang nắng cháy rạng ngời phố quen<br>
      Thu về lá rụng bên thềm</p>
    <hr>
    <p class="kho do">
      Đông sang gió lạnh bên em đợi chờ<br>
      Bốn mùa là bốn giấc mơ<br>
      Thời gian đi mãi ta chờ đợi ai
    </p>
    <hr>
    <p class="kho xanh">
      Một năm rồi lại một năm<br>
      Vẫn còn câu hát thì thầm quê hương<br>
      Chờ xuân nắng mới soi đường</p>
  </article>
</body>
</html>
